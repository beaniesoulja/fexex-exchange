<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Fexex brand identity board</title>
  <desc id="desc">A visual identity board showing the Fexex logo, tagline, brand colours and graphic language.</desc>
  <rect width="1600" height="1000" fill="#F4F3EE"/>
  <rect x="936" width="664" height="1000" fill="#161818"/>
  <g transform="translate(94 84)"><rect width="70" height="70" rx="19" fill="#C6F65C"/><path d="M16 23h31L40 32H22zm13 19h27l-7 9H35z" fill="#161818"/><text x="88" y="51" fill="#161818" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" letter-spacing="-4">FEXEX</text></g>
  <text x="94" y="362" fill="#161818" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="140" letter-spacing="-10">Trade value.</text>
  <text x="94" y="506" fill="#161818" font-family="Georgia, serif" font-size="142" letter-spacing="-10">Feel certain.</text>
  <text x="101" y="580" fill="#777A75" font-family="Arial, Helvetica, sans-serif" font-size="24">A clear, confident way to move value forward.</text>
  <g transform="translate(94 760)"><text fill="#777A75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">CORE PALETTE</text><rect x="0" y="34" width="102" height="102" rx="15" fill="#161818"/><rect x="120" y="34" width="102" height="102" rx="15" fill="#C6F65C"/><rect x="240" y="34" width="102" height="102" rx="15" fill="#D6C7FF"/><rect x="360" y="34" width="102" height="102" rx="15" fill="#777A75"/></g>
  <circle cx="1318" cy="334" r="365" fill="none" stroke="#D6C7FF" stroke-opacity=".5"/><circle cx="1318" cy="334" r="250" fill="none" stroke="#D6C7FF" stroke-opacity=".5"/>
  <g transform="translate(1054 225) rotate(-7 210 175)"><rect width="420" height="350" rx="32" fill="#F4F3EE"/><text x="36" y="58" fill="#161818" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="2">FEXEX / TRADE</text><text x="36" y="222" fill="#161818" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-5">$250.00</text><text x="36" y="258" fill="#777A75" font-family="Arial, Helvetica, sans-serif" font-size="17">Amazon · United States</text><rect x="36" y="285" width="348" height="11" rx="6" fill="#D2D2CD"/><rect x="36" y="285" width="230" height="11" rx="6" fill="#C6F65C"/></g>
  <g transform="translate(1058 738)"><rect width="105" height="105" rx="53" fill="#C6F65C"/><path d="M28 37h47L62 54H38zm19 25h39L73 79H54z" fill="#161818"/><text x="136" y="48" fill="#F4F3EE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SIGNAL FORWARD</text><text x="136" y="78" fill="#A9AFA9" font-family="Arial, Helvetica, sans-serif" font-size="17">A small signal that says</text><text x="136" y="103" fill="#A9AFA9" font-family="Arial, Helvetica, sans-serif" font-size="17">your value is moving on.</text></g>
